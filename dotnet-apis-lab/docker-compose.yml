version: "3.9"
services:
  helloapi:
    build:
      context: .
      dockerfile: ./Dockerfile.hello
    container_name: helloapi
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    ports:
      - "5050:8080"
    networks:
      - appnet

  timeapi:
    build:
      context: .
      dockerfile: ./Dockerfile.time
    container_name: timeapi
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    ports:
      - "5052:8080"
    networks:
      - appnet

  gatewayapi:
    build:
      context: .
      dockerfile: ./Dockerfile.gateway
    container_name: gatewayapi
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - HELLO_URLS=http://helloapi:8080
      - TIME_URLS=http://timeapi:8080
    ports:
      - "5055:8080"
    networks:
      - appnet  

networks:
  appnet:
    driver: bridge